plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
version = '1.0.0'
group = 'com.furryfemboy'
base { archivesName = 'furryfemboy' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1'; copyIdeResources = true
 runs { configureEach { workingDirectory project.file('run'); mods { furryfemboy { source sourceSets.main } } } }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'; implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9') }
jar { manifest { attributes(['Specification-Title':'Furry Femboy Mod','Implementation-Version':project.version]) } }
